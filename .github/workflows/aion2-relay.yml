name: AION 2 maintenance relay

on:
  schedule:
    # Every 15 min on the quarter hour (:00, :15, :30, :45). GitHub's scheduler is
    # busiest at the start of each hour, so the :00 run is the likeliest to be late.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
    inputs:
      preview:
        description: "Preview only: show what the newest tweets would post as. Posts and saves nothing."
        type: boolean
        default: false
      count:
        description: "Preview: how many of each feed's newest tweets to show"
        type: number
        default: 3

permissions:
  contents: write             # only needed to commit the seen-posts state file
  actions: read               # lets GitHub's own scheduled runs check the cron-job.org trigger

concurrency:
  # Previews get their own group: GitHub keeps only one pending run per group, so a queued
  # preview could otherwise cancel a queued real run.
  group: ${{ inputs.preview && 'aion2-preview' || 'aion2-relay' }}
  cancel-in-progress: false   # never run two at once (avoids double posts)

jobs:
  relay:
    # Only main posts for real; any branch can be previewed.
    if: inputs.preview || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Latest branch state, not the commit from when this run was triggered. A run queued
          # behind another would otherwise load stale aion2_seen.json and repost its tweets.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the 15-minute trigger
        # Only on GitHub's own (backup) schedule: when did cron-job.org last start a run?
        # The relay posts a warning if that was over an hour ago (e.g. its token expired).
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow aion2-relay.yml --event workflow_dispatch \
                 --branch main --limit 1 --json createdAt -q '.[0].createdAt // ""' || true)
          echo "Last cron-job.org run: ${last:-none found}"
          echo "LAST_DISPATCH=$last" >> "$GITHUB_ENV"

      - name: Check feed and post to Discord
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}       # optional
          CATEGORIES: maintenance,event,update                   # drop any you don't want
          SOURCE_TZ: KST
          STATE_FILE: aion2_seen.json
          PREVIEW: ${{ inputs.preview && '1' || '' }}
          PREVIEW_COUNT: ${{ inputs.count }}
        run: python aion2_maint_relay.py

      - name: Save seen-posts state
        # Also after a failed post, so successful ones aren't reposted. Never in preview.
        if: (success() || failure()) && !inputs.preview
        run: |
          [ -f aion2_seen.json ] || { echo "No state file yet"; exit 0; }
          git config user.name "aion2-relay-bot"
          git config user.email "aion2-relay-bot@users.noreply.github.com"
          git add aion2_seen.json
          git diff --cached --quiet && { echo "No new posts"; exit 0; }
          git commit -m "Update seen posts [skip ci]"
          # Retry: a push landing between our pull and push (e.g. a code change) would otherwise
          # lose this run's state, and the next run would repost its tweets. -X theirs keeps
          # this run's aion2_seen.json if you edited it mid-run.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
